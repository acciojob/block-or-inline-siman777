<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div data-ns-test="block-inline-button">
		<button>btn1</button>
		<button>btn2</button>
		<span>Answer:Inline</span>
	</div>

	<div data-ns-test="block-inline-div">
		<div>btn1</div>
		<div>btn2</div>
		<span>Answer:Block</span>
	</div>

	<div data-ns-test="block-inline-span">
		<span>btn1</span>
		<span>btn2</span>
		<span>Answer:Inline</span>
	</div>

	<div data-ns-test="block-inline-p">
		<p>btn1</p>

	</div>

	<div data-ns-test="block-inline-cite">
		<cite>btn1</cite>
		<cite>btn2</cite>

	</div>

		<h1>btn1</h1>
		<h1>btn2</h1>

	</div>

	<div data-ns-test="block-inline-sup">
		<sup>btn1</sup>
		<sup>btn2</sup>
		<span>Answer:Inline</span>
	</div>
